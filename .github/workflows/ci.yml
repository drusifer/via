name: CI

# Runs on pushes to main and on pull requests. All third-party actions are
# pinned to full commit SHAs; gitleaks is downloaded with a pinned version and
# verified against its SHA-256 checksum.
on:
  push:
    branches: [main]
  pull_request:

# Least privilege: jobs get a read-only token.
permissions:
  contents: read

jobs:
  test-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install via and dev dependencies
        run: pip install -e ".[dev]"

      - name: Lint with Ruff
        run: ruff check via/

      - name: Run Python tests
        run: pytest tests/ -q

      - name: Smoke-test the via CLI
        run: via --help >/dev/null

  test-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install JS dependencies
        run: npm ci

      - name: Run JS unit tests
        run: npm test

  secrets:
    # Server-side backstop for the local gitleaks pre-commit hook.
    # Per ADR-28-2, scans incoming PR/push commit ranges via --log-opts while
    # pre-existing commit 9817f24 (.continue/agents/config.yaml:10) awaits
    # owner verification/rotation. Never add .gitleaksignore or allowlists;
    # upgrade to a full-history scan once commit 9817f24 is cleared.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned version and checksum)
        env:
          GITLEAKS_VERSION: "8.26.0"
          GITLEAKS_SHA256: "32faa8a77f6ce4b483921072ea89f78a794ad1d96471f2ad6e01ad3b0ebafa00"
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks

      - name: Scan commit range for secrets
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ZERO_SHA="0000000000000000000000000000000000000000"
          if [ "${EVENT_NAME}" = "pull_request" ] \
            && [ -n "${PR_BASE_SHA}" ] && [ -n "${PR_HEAD_SHA}" ] \
            && git cat-file -e "${PR_BASE_SHA}^{commit}" 2>/dev/null \
            && git cat-file -e "${PR_HEAD_SHA}^{commit}" 2>/dev/null; then
            LOG_RANGE="${PR_BASE_SHA}..${PR_HEAD_SHA}"
          elif [ "${EVENT_NAME}" = "push" ] \
            && [ -n "${PUSH_BEFORE_SHA}" ] \
            && [ "${PUSH_BEFORE_SHA}" != "${ZERO_SHA}" ] \
            && git cat-file -e "${PUSH_BEFORE_SHA}^{commit}" 2>/dev/null; then
            LOG_RANGE="${PUSH_BEFORE_SHA}..${PUSH_AFTER_SHA}"
          elif git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            LOG_RANGE="HEAD~1..HEAD"
          else
            LOG_RANGE="HEAD"
          fi
          echo "Scanning commit range: ${LOG_RANGE}"
          ./gitleaks detect --source . --no-banner --log-opts="${LOG_RANGE}"
