[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "via"
version = "0.1.0"
description = "Python codebase indexing and querying CLI tool"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pathspec>=0.11.0",
    "pygments>=2.15.0",
    "watchdog>=3.0.0",
    "mcp>=1.26",
    "tree-sitter>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.4.0",
    "reorder-python-imports",
    "pylint>=3.0.0",
    "bandit>=1.7.0",
]

[project.scripts]
via = "via.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["via*"]
exclude = ["agents*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=via --cov-report=term-missing"

# =============================================================================
# RUFF - Fast Python linter (complexity, dead code, unused imports)
# =============================================================================
[tool.ruff]
target-version = "py38"
line-length = 100
src = ["via"]

[tool.ruff.lint]
select = [
    "F401",   # unused-import
    "F841",   # unused-variable
    "C90",    # mccabe complexity
    "ERA",    # commented-out code (eradicate)
]

[tool.ruff.lint.mccabe]
max-complexity = 10

# =============================================================================
# PYLINT - Duplicate code detection and design rules
# =============================================================================
[tool.pylint.main]
source-roots = ["."]
ignore-paths = ["tests", "agents"]

[tool.pylint.typecheck]
ignored-modules = ["mcp", "watchdog", "pygments"]

[tool.pylint."messages control"]
enable = ["duplicate-code"]
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "too-few-public-methods",
]

[tool.pylint.design]
max-args = 7
max-locals = 15
max-statements = 50
max-branches = 12
max-returns = 6

[tool.pylint.similarities]
min-similarity-lines = 6
ignore-comments = true
ignore-docstrings = true
ignore-imports = true

# =============================================================================
# BANDIT - Security vulnerability scanner
# =============================================================================
[tool.bandit]
targets = ["via"]
exclude_dirs = ["tests", "agents"]
skips = ["B608"]
